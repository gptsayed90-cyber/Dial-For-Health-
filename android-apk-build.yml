
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find project files
        run: |
          ls -la
          find . -maxdepth 3 -name gradlew -o -name pubspec.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f android/gradlew ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle project not found. Check project structure."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
